[versions]
agp = "8.13.2"
kotlin = "2.2.21"
coreKtx = "1.17.0"
coroutines = "1.10.2"
media3 = "1.9.0"
okhttp = "4.12.0"
coil = "2.7.0"
recyclerview = "1.4.0"
junit = "4.13.2"
kxml2 = "2.3.0"
tvprovider = "1.0.0"

[libraries]
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
androidx-recyclerview = { module = "androidx.recyclerview:recyclerview", version.ref = "recyclerview" }
coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
media3-exoplayer = { module = "androidx.media3:media3-exoplayer", version.ref = "media3" }
media3-exoplayer-hls = { module = "androidx.media3:media3-exoplayer-hls", version.ref = "media3" }
media3-exoplayer-dash = { module = "androidx.media3:media3-exoplayer-dash", version.ref = "media3" }
media3-exoplayer-rtsp = { module = "androidx.media3:media3-exoplayer-rtsp", version.ref = "media3" }
media3-datasource-okhttp = { module = "androidx.media3:media3-datasource-okhttp", version.ref = "media3" }
media3-ui = { module = "androidx.media3:media3-ui", version.ref = "media3" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
tvprovider = { module = "androidx.tvprovider:tvprovider", version.ref = "tvprovider" }
coil = { module = "io.coil-kt:coil", version.ref = "coil" }
junit = { module = "junit:junit", version.ref = "junit" }
kxml2 = { module = "net.sf.kxml:kxml2", version.ref = "kxml2" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
